name: monitoring-stack

networks:
  obs:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: monitoring-stack/sample-app:v1.0.0
    container_name: ms-app
    networks: [obs]
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: v1.0.0
      APP_COMMIT: local
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    # healthcheck defined in Dockerfile (distroless has no shell)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ms-prometheus
    networks: [obs]
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ms-alertmanager
    networks: [obs]
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ms-node-exporter
    networks: [obs]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    # NOTE: a native Linux deployment may want to add `-/:/host:ro,rslave` and `--path.rootfs=/host`
    # for full disk-usage visibility. Omitted by default because Docker Desktop on macOS
    # cannot satisfy the shared/slave-mount requirement on `/`.
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ms-cadvisor
    networks: [obs]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ms-grafana
    networks: [obs]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

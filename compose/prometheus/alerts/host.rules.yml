groups:
  - name: host.rules
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 85% on {{ $labels.instance }}"
          description: "Average CPU utilization has been above 85% for the last 10 minutes."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#hosthighcpu"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90% on {{ $labels.instance }}"
          description: "Available memory has been below 10% for the last 10 minutes."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#hosthighmemory"

      - alert: HostDiskWillFillIn4h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[1h], 4 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 4 hours"
          description: "Linear projection of available bytes over the last hour crosses zero within 4 hours."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#hostdiskwillfillin4h"

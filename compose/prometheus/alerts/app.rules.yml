groups:
  - name: app.rules
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sample app is DOWN"
          description: "Prometheus has been unable to scrape job=app for 2 minutes."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#appdown"

      - alert: AppHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="app",code=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sample app 5xx error rate above 5% over 5m"
          description: "More than 5% of requests are returning 5xx for at least 5 minutes."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#apphigherrorrate"

      - alert: AppHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="app"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sample app p95 latency above 1s over 10m"
          description: "95th-percentile request duration is above 1 second."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#apphighlatencyp95"

      - alert: AppSLOBurnRateFast
        # Multi-window multi-burn-rate per Google SRE workbook.
        # SLO: 99% of requests succeed (non-5xx). Error budget = 1%.
        # Fast burn: error rate over 5m AND 1h both exceed 14.4 * (1 - SLO) = 0.144.
        expr: |
          (
            sum(rate(http_requests_total{job="app",code=~"5.."}[5m]))
              / sum(rate(http_requests_total{job="app"}[5m]))
          ) > (14.4 * 0.01)
          and
          (
            sum(rate(http_requests_total{job="app",code=~"5.."}[1h]))
              / sum(rate(http_requests_total{job="app"}[1h]))
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sample app burning error budget fast"
          description: "Multi-window burn rate (5m & 1h) exceeds 14.4x — at this rate the 28d error budget is exhausted within ~2 days."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#appsloburnratefast"

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target down: job={{ $labels.job }} instance={{ $labels.instance }}"
          description: "Target has been unreachable for 5 minutes."
          runbook_url: "https://github.com/yashyaadav/monitoring_stack/blob/main/docs/RUNBOOK.md#prometheustargetmissing"
